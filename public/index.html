<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Кошачье чутьё</title>
  <link rel="icon" href="/assets/cat/curious.webp" type="image/webp">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #111; color: #eee; font: 16px/1.4 system-ui, sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    video, #overlay { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; }
    video { object-fit: cover; filter: saturate(.5) brightness(1.1) contrast(.95) blur(.6px); }
    #overlay { touch-action: manipulation; }
    :root { --cat-size: clamp(96px, 30vw, 150px); }
    #cat { position: fixed; right: calc(16px + env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); width: var(--cat-size); height: var(--cat-size); display: grid; place-items: center; font-size: calc(var(--cat-size) * .6); line-height: 1; transform-origin: 50% 100%; pointer-events: none; animation: breathe 3s ease-in-out infinite; }
    #cat img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 4px 6px rgba(0, 0, 0, .35)); -webkit-user-drag: none; }
    /* The closed-eyes picture lies exactly over the open one and shows for a moment. */
    #cat > *, #intro-cat > * { grid-area: 1 / 1; }
    .blink { opacity: 0; }
    .is-blink .blink { opacity: 1; }
    #bubble { position: fixed; right: calc(16px + env(safe-area-inset-right)); bottom: calc(24px + var(--cat-size) + env(safe-area-inset-bottom)); max-width: min(70vw, 320px); padding: 10px 14px; border-radius: 16px; background: rgba(255, 255, 255, .95); color: #1c1c1e; font-size: 16px; font-weight: 500; line-height: 1.35; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); pointer-events: none; transform-origin: calc(100% - 36px) 100%; }
    #bubble::after { content: ''; position: absolute; right: 30px; bottom: -6px; width: 12px; height: 12px; background: inherit; border-radius: 0 0 3px 0; transform: rotate(45deg); }
    #bubble:empty { display: none; }
    #bubble.is-pop { animation: pop .18s ease-out; }
    /* Each reaction plays once, then the cat settles back into breathing. */
    #cat.is-think { animation: think 1.2s ease-in-out infinite; }
    #cat.is-want { animation: hop .45s ease-out 2, breathe 3s ease-in-out .9s infinite; }
    #cat.is-scared { animation: shake .5s linear, breathe 3s ease-in-out .5s infinite; }
    #cat.is-happy { animation: wiggle .6s ease-in-out 2, breathe 3s ease-in-out 1.2s infinite; }
    #cat.is-curious { animation: tilt .8s ease-in-out, breathe 3s ease-in-out .8s infinite; }
    @keyframes breathe { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.03); } }
    @keyframes think { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @keyframes hop { 0%, 100% { transform: translateY(0); } 40% { transform: translateY(-12px); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-4px); } 40%, 80% { transform: translateX(4px); } }
    @keyframes wiggle { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
    @keyframes tilt { 0%, 100% { transform: rotate(0); } 40% { transform: rotate(-6deg); } }
    @keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.96); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { #cat, #cat[class], #bubble.is-pop, .dots i, #intro-bubble, #intro-cat { animation: none; } #cat img { transition: none; } }
    #cat img { transform-origin: 50% 100%; transform: rotate(var(--lean, 0deg)); transition: transform .4s ease; }
    .dots { display: inline-flex; gap: 5px; padding: 5px 2px; vertical-align: middle; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: #8e8e93; animation: dot 1s ease-in-out infinite; }
    .dots i:nth-child(2) { animation-delay: .15s; }
    .dots i:nth-child(3) { animation-delay: .3s; }
    @keyframes dot { 0%, 60%, 100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-4px); opacity: 1; } }
    body.is-intro #cat, body.is-intro #bubble, body.is-intro #overlay { display: none; }
    #intro { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom)); background: radial-gradient(circle at 50% 45%, #2a1d14 0%, #111 70%); text-align: center; }
    #intro h1 { margin: 0; font-size: clamp(28px, 8vw, 40px); font-weight: 800; letter-spacing: -.02em; color: #fff; }
    #intro h1 span { color: #f5a623; }
    #intro-bubble { position: relative; max-width: min(80vw, 320px); padding: 12px 16px; border-radius: 16px; background: rgba(255, 255, 255, .95); color: #1c1c1e; font-weight: 500; line-height: 1.35; box-shadow: 0 6px 20px rgba(0, 0, 0, .25); animation: pop .3s ease-out .2s backwards; }
    #intro-bubble::after { content: ''; position: absolute; left: 50%; bottom: -6px; width: 12px; height: 12px; margin-left: -6px; background: inherit; border-radius: 0 0 3px 0; transform: rotate(45deg); }
    #intro-cat { display: grid; width: min(60vw, 260px); margin-top: -8px; transform-origin: 50% 100%; filter: drop-shadow(0 10px 20px rgba(0, 0, 0, .45)); animation: breathe 3s ease-in-out infinite; }
    #intro-cat img { width: 100%; height: auto; -webkit-user-drag: none; }
    #start { font: inherit; font-size: 18px; font-weight: 700; padding: 15px 32px; border: 0; border-radius: 999px; background: #f5a623; color: #1c1c1e; box-shadow: 0 8px 24px rgba(245, 166, 35, .35); transition: transform .1s, opacity .2s; }
    #start:active { transform: scale(.96); }
    #start:disabled { opacity: .6; }
    #intro p { margin: 0; max-width: 300px; font-size: 14px; color: #a1a1a6; }
    #debug-crop { position: fixed; left: calc(8px + env(safe-area-inset-left)); top: calc(8px + env(safe-area-inset-top)); width: 120px; border: 2px solid #f5a623; pointer-events: none; }
  </style>
</head>
<body class="is-intro">
  <video id="video" playsinline muted autoplay></video>
  <canvas id="overlay"></canvas>
  <div id="cat" aria-hidden="true"><img id="cat-img" src="/assets/cat/curious.webp" alt="" draggable="false"><img class="blink" src="/assets/cat/blink.webp" alt="" draggable="false"></div>
  <div id="bubble" aria-live="polite"></div>
  <section id="intro">
    <h1>Кошачье <span>чутьё</span></h1>
    <div id="intro-bubble" aria-live="polite">Мяу! Включи камеру, я посмотрю вместе с тобой.</div>
    <div id="intro-cat"><img id="intro-img" src="/assets/cat/curious.webp" alt="Рыжий кот" draggable="false"><img class="blink" src="/assets/cat/blink.webp" alt="" draggable="false"></div>
    <button id="start">Включить камеру</button>
    <p>Тапни по предмету или человеку, и кот скажет, что думает.</p>
  </section>
  <img id="debug-crop" alt="" hidden>
  <!-- main.js goes first: scripts in this list run in order, so a hanging CDN placed
       before it would leave the start button dead. detect.js waits for the load event. -->
  <script type="module" src="/js/main.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
</body>
</html>
